# zmk-tc32's west manifest: Zephyr is zephyr-tc32 (the Telink TC32 port), at a
# pinned commit. Nothing else is fetched: a TC32 build needs none of the HALs
# or libraries upstream ZMK's manifest brings (tc32/compat stands in for the
# LVGL and Nordic HAL Kconfig symbols ZMK sets).
#
# The keyboards' repository, tc32-keyboards, imports this manifest:
#
#   west init -m https://github.com/goyamamoto/tc32-keyboards <workspace>
#   cd <workspace> && west update
#
# gives <workspace>/tc32-keyboards, <workspace>/zmk (this repository) and
# <workspace>/zephyr, the layout tc32/scripts/build.sh expects (TC32.md, Build),
# and Zephyr's west commands. Used on its own:
#
#   west init -m https://github.com/goyamamoto/zmk-tc32 --mf app/west.yml <workspace>
#
# ZMK's own west commands (west test, west metadata) are not registered: their
# scripts are found only when west is set up with `west init -l app`, upstream's way.
manifest:
  remotes:
    - name: goyamamoto
      url-base: https://github.com/goyamamoto
  projects:
    - name: zephyr
      remote: goyamamoto
      repo-path: zephyr-tc32
      revision: a7410dadb103cf00a9e78593a3abada3219257d3
      west-commands: scripts/west-commands.yml
  self:
    path: zmk
