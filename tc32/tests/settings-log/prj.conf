# The settings backend of tc32/ (src/tlsr_settings_log.c) on native_sim, with
# the flash simulator in NOR mode (writes only clear bits).
CONFIG_ZTEST=y
CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_CUSTOM=y
CONFIG_TLSR_SETTINGS_LOG=y
CONFIG_ZTEST_STACK_SIZE=4096
