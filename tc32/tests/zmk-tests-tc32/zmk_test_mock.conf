# SPDX-License-Identifier: MIT
# ZMK's snapshot tests on the TC32, in tc32-devtools' emulator: the settings
# of the native_sim test board (native_sim_native_zmk_test_mock_defconfig)
# and app/run-test.sh (CONFIG_ASSERT), with the log written as it is made to
# the emulator's console (a register the chip does not have: never for
# hardware).
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_TC32EMU=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_SHOW_COLOR=n
# One message at a time: a pre-empting thread cannot split a line.
CONFIG_LOG_IMMEDIATE_CLEAN_OUTPUT=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_DEBUG=y
CONFIG_ASSERT=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
# No USB or BLE, as on native_sim.
CONFIG_ZMK_USB=n
CONFIG_ZMK_BLE=n
# An immediate log formats on the caller's stack.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=2048
CONFIG_INPUT_THREAD_STACK_SIZE=4096
