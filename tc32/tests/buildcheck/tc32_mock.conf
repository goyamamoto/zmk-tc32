# No USB or BLE yet on TC32: build the key-processing core only.
CONFIG_ZMK_USB=n
CONFIG_ZMK_BLE=n
# ZMK main still includes <syscalls/...>; Zephyr 4.4 only keeps that path
# behind a deprecated option.
CONFIG_LEGACY_GENERATED_INCLUDE_PATH=y
CONFIG_WARN_DEPRECATED=n
