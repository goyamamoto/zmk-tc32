# Boot guard and slot revert of tc32/ on native_sim, with the flash
# simulator in NOR mode (writes only clear bits).
CONFIG_ZTEST=y
CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y
CONFIG_TLSR_BOOT_GUARD=y
CONFIG_TLSR_SLOTS_SIM=y
CONFIG_LOG=y
CONFIG_TLSR_SLOTS_LOG_LEVEL_INF=y
