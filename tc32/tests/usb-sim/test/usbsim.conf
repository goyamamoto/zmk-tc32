# TLSR8278 usb_dc driver test on native_sim//zmk_test_mock.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=n
CONFIG_TLSR_USB_SIM_TEST=y
CONFIG_USB_NATIVE_POSIX=n
CONFIG_USB_DRIVER_LOG_LEVEL_INF=y
# A product string longer than one EP0 packet, and an LED output report for the
# OUT data stage of SET_REPORT.
CONFIG_ZMK_KEYBOARD_NAME="TLSR USB sim"
CONFIG_ZMK_HID_INDICATORS=y
# the Telink USB OTA receiver of tc32/ on a second HID interface, writing to the
# flash simulator. Flash writes only clear bits, as on NOR flash.
CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y
CONFIG_TLSR_USB_OTA=y
# The update gate's unlock window short, so that the test sees it end.
CONFIG_TLSR_USB_OTA_ARM_MS=300
CONFIG_TLSR_SLOTS_SIM=y
CONFIG_TLSR_BOOT_GUARD=y
# A Zbit flash's supply trims, as a model in the test (tlsr_usb_ota_host.c).
CONFIG_TLSR_USB_OTA_SIM_TRIMS=y
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_HID_INTERRUPT_EP_MPS=64
